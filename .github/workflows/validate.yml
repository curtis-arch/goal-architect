name: Validate skill

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run behavioral self-tests
        run: python3 -B skills/goal-architect/scripts/self_test.py

      - name: Verify skills CLI discovery
        run: npx --yes skills@1.5.21 add . --list | grep -q "goal-architect"
